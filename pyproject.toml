[project]
name = "lidar-discovery-poland"
version = "0.1.0"
description = "Desk-only LiDAR processing framework for traces of villages emptied in 1944-1951 in SE Poland"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.162.5",
    "httpx>=0.28.1",
    "laspy[lazrs]>=2.7.0",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pyproj>=3.8.0",
    "pyyaml>=6.0.3",
    "rasterio>=1.5.2",
    "rio-tiler>=9.4.13",
    "scipy>=1.18.1",
    "shapely>=2.2.0",
    "sqlmodel>=0.0.49",
    "typer>=0.29.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ldp = "lidar_discovery.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lidar_discovery"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
ml = [
    "torch>=2.4",
    "timm>=1.0",
    "segmentation-models-pytorch>=0.4",
    "lightgbm>=4.0",
    "scikit-learn>=1.4",
    "scikit-image>=0.22",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["B008", "RUF012", "RUF001", "RUF002", "RUF003", "BLE001", "S110", "S112", "SIM102", "RUF046", "RUF059", "F841", "PLW1510", "F811", "PLR0402", "I001", "E501", "E701", "E702", "B905", "F401", "F821", "RUF100", "SIM105", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"src/lidar_discovery/ml/archaeoscape/*.py" = ["E501"]
"src/lidar_discovery/ml/transfer.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = ["network: tests that need internet access (skipped by default)"]
